"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_macchiato"

# General behavior
add_newline = true     # Blank line between commands
command_timeout = 1000 # ms
scan_timeout = 30      # ms per dir scan, keeps it snappy

# Overall layout: 2-line prompt with right-aligned timestamp
format = """
[╭](fg:overlay0) $username$hostname${env_var.WSL}$directory$git_branch$git_status$cmd_duration$fill$time
[╰](fg:overlay0) $character"""

[fill]
symbol = " "

# ── Catppuccin Macchiato Palette ──────────────────────────────────────────
[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo  = "#f0c6c6"
pink      = "#f5bde6"
mauve     = "#c6a0f6"
red       = "#ed8796"
maroon    = "#ee99a0"
peach     = "#f5a97f"
yellow    = "#eed49f"
green     = "#a6da95"
teal      = "#8bd5ca"
sky       = "#91d7e3"
sapphire  = "#7dc4e4"
blue      = "#8aadf4"
lavender  = "#b7bdf8"
text      = "#cad3f5"
subtext1  = "#b8c0e0"
subtext0  = "#a5adcb"
overlay2  = "#939ab7"
overlay1  = "#8087a2"
overlay0  = "#6e738d"
surface2  = "#5b6078"
surface1  = "#494d64"
surface0  = "#363a4f"
base      = "#24273a"
mantle    = "#1e2030"
crust     = "#181926"

# ── Username & Host ────────────────────────────────────────────────────────
[username]
show_always = true
style_user = "bold fg:lavender"
style_root = "bold fg:red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "fg:mauve"
format = "@[$hostname]($style) "

# ── Directory ─────────────────────────────────────────────────────────────
[directory]
truncation_length = 3
truncate_to_repo = false
truncation_symbol = ".../"
style = "bold fg:blue"
read_only = " "
format = "in [$path]($style)[$read_only]($read_only_style) "

# ── Git info ──────────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "bold fg:mauve"
truncation_length = 30
truncation_symbol = "…"
format = '\[[$symbol$branch]($style)\] '

[git_status]
style = "fg:peach"
format = "([$all_status$ahead_behind]($style)) "
conflicted = "✖"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "≡"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# ── Command duration ──────────────────────────────────────────────────────
[cmd_duration]
min_time = 2000                      # show if > 2s
style = "fg:overlay1"
format = "took [$duration]($style) "

# ── Timestamp (Right-hand side) ───────────────────────────────────────────
[time]
disabled = false
time_format = "%R"                   # HH:MM
style = "fg:subtext0"
format = "[ $time]($style)"

# ── Prompt character ──────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:green)"
vimcmd_replace_symbol = "[❮](bold fg:yellow)"
vimcmd_visual_symbol = "[❮](bold fg:mauve)"

# ── Modification based on environment variables ───────────────────────────
[env_var.WSL]
variable = "WSL_DISTRO_NAME"
style = "bold fg:yellow"
format = '[\($env_value\)]($style) '
disabled = false
